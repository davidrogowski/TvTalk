<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock The Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121016; --panel:#1b1820; --panel2:#211d28; --line:#2e2a34;
    --ink:#f3ece0; --muted:#9a9088; --amber:#e7b24c; --amber-d:#c8942f; --red:#d6453f;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,sans-serif;
       background:radial-gradient(900px 520px at 50% -120px,#241b16,var(--bg));
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 16px 60px}

  /* marquee masthead */
  .mast{text-align:center;margin-bottom:22px}
  .bulbs{display:flex;gap:9px;justify-content:center;margin-bottom:12px}
  .bulb{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px 1px rgba(231,178,76,.6)}
  .bulb.off{background:#4a4038;box-shadow:none}
  .mast h1{font-family:"Anton",sans-serif;font-weight:400;font-size:50px;letter-spacing:.02em;
           line-height:.9;margin:0;text-transform:uppercase}
  .mast h1 em{font-style:normal;color:var(--amber)}
  .mast .sub{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:11px}

  .card{width:100%;max-width:480px;background:linear-gradient(180deg,var(--panel),#161319);
        border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 24px 60px -24px #000}

  /* progress */
  .rung{display:flex;gap:8px;justify-content:center;margin:0 0 18px}
  .rung .d{width:30px;height:5px;border-radius:99px;background:#332e3a;transition:.25s}
  .rung .d.used{background:var(--amber)}
  .rung .d.cur{background:var(--amber);opacity:.45}
  .rung .d.solved{background:var(--amber)}

  .stagelabel{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.22em;
              text-transform:uppercase;margin-bottom:20px}

  /* play button */
  .play{display:flex;flex-direction:column;align-items:center;gap:13px;margin:6px 0 20px}
  .pbtn{width:104px;height:104px;border-radius:50%;border:2px solid var(--amber);background:transparent;
        cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .pbtn:hover{background:var(--amber)} .pbtn:hover svg{fill:#1a140a}
  .pbtn svg{width:38px;height:38px;fill:var(--amber);margin-left:5px;transition:fill .15s}
  .pbtn.playing{animation:pulse 1.1s ease-in-out infinite}
  .pbtn.disabled{border-color:#403a34;cursor:not-allowed}
  .pbtn.disabled svg{fill:#5b5249}
  .pbtn.disabled:hover{background:transparent}
  @keyframes pulse{50%{box-shadow:0 0 0 7px rgba(231,178,76,.12)}}
  .phint{font-size:13px;color:var(--muted)}
  .listens{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#d8cdba;
           background:#100d14;border:1px solid var(--line);border-radius:999px;padding:5px 14px}

  /* clue reveals */
  .reveals{min-height:6px;margin:2px 0 6px}
  .reveal{border-top:1px solid var(--line);padding:14px 2px}
  .reveal .k{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber-d);margin-bottom:7px}
  .caption{font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:21px;line-height:1.35;color:#efe7da}
  .masked{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:26px;letter-spacing:.14em;color:var(--amber)}
  .masked .b{color:#5b5048}

  /* guess box */
  .guesswrap{position:relative;margin-top:20px}
  .ginput{width:100%;background:#100d14;border:1px solid var(--line);color:var(--ink);font-family:inherit;
          border-radius:10px;padding:13px 15px;font-size:16px;outline:none}
  .ginput:focus{border-color:var(--amber)}
  .ginput::placeholder{color:#6c6258}
  .drop{position:absolute;left:0;right:0;top:54px;background:#100d14;border:1px solid var(--line);
        border-radius:10px;max-height:230px;overflow:auto;z-index:5;display:none}
  .drop.show{display:block}
  .opt{padding:11px 15px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
  .opt.active,.opt:hover{background:#221d28}
  .opt .t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .btnrow{display:flex;gap:11px;margin-top:14px}
  button.act{flex:1;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);
             padding:14px;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
             cursor:pointer;font-family:inherit;transition:.12s}
  button.act:hover{border-color:#4a4350}
  button.primary{background:var(--amber);border-color:var(--amber);color:#1a140a}
  button.primary:hover{background:#f0bd5a}

  /* result */
  .result{text-align:center}
  .result h2{margin:6px 0 6px;font-family:"Anton",sans-serif;font-weight:400;font-size:30px;
             text-transform:uppercase;letter-spacing:.02em}
  .result h2.win{color:var(--amber)}
  .result .showname{font-family:"Anton",sans-serif;font-weight:400;font-size:30px;text-transform:uppercase;
                    letter-spacing:.01em;margin:6px 0 0;line-height:1}
  .result .ans{color:var(--amber)}
  .result .miss{color:var(--red)}
  .typetag{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
           border:1px solid var(--line);border-radius:999px;padding:3px 9px;vertical-align:middle;margin-left:10px;
           font-family:"Hanken Grotesk",sans-serif}
  .result .desc{font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:18px;color:#d8cdba;margin:10px 0 0}
  .result .streak{color:var(--amber);font-weight:700;font-size:14px;margin:6px 0 0;letter-spacing:.02em}
  .share a{color:var(--amber);text-decoration:underline}
  .act.dl{width:100%;margin-top:16px;background:#19140e;border-color:var(--amber-d);color:var(--amber)}
  .act.dl:hover{background:var(--amber);color:#1a140a;border-color:var(--amber)}
  .share{font-family:ui-monospace,Menlo,monospace;background:#100d14;border:1px solid var(--line);
         border-radius:10px;padding:14px;margin:16px 0;font-size:15px;white-space:pre-wrap;letter-spacing:.04em}
  .small{color:var(--muted);font-size:12px;text-align:center;margin-top:20px;letter-spacing:.02em}
  .wrongs{font-size:12px;color:var(--red);min-height:16px;text-align:center;margin-top:10px;letter-spacing:.04em}
  a.replaybtn{color:var(--muted);font-size:13px;text-decoration:none;border-bottom:1px dotted var(--muted)}
</style>
</head>
<body>
  <div class="mast">
    <div class="bulbs"><span class="bulb"></span><span class="bulb"></span><span class="bulb off"></span><span class="bulb"></span><span class="bulb"></span></div>
    <h1>Clock<br>the <em>Quote</em></h1>
    <div class="sub">Now Showing · Beta</div>
  </div>

  <div class="card" id="card"></div>
  <p class="small">Beta · 5 clips for now (one-a-day coming soon).<br>
     <a href="#" id="newRound" class="replaybtn">↻ New clip</a> &nbsp;·&nbsp;
     <a href="/" class="replaybtn">← TV TALK soundboard</a></p>

<script>
/* ---------- data: 10 real clips + all 64 titles (from shows.js) ---------- */
const AUDIO_BASE = "/"; // served at /clockthequote; clips live at /audio/
const GAME_NAME = "Clock The Quote";
const PLAY_URL  = "https://tvtalk.fun/clockthequote";
const CLIPS = [
  {show:"Strange Wilderness", text:"Bears vs both World Wars", url:"audio/strange-wilderness/001_bears_have_been_known_to_attack_man_although_the_fact_is_tha.mp3"},
  {show:"Austin Powers: Goldmember", text:"Doctor Who makes house calls", url:"audio/austin-powers-goldmember/001_a_powers_you_better_watch_your_freaking_self_because_this_is.mp3"},
  {show:"Nathan For You", text:"Do not answer to nobody", url:"audio/nathan-for-you/008_do_not_answer_to_nobody.mp3"},
  {show:"Drake & Josh", text:"Drake, where's the door hole?", url:"audio/drake-and-josh/006_drake_where_s_the_door_hole.mp3"},
  {show:"Blue Mountain State", text:"Get out of my house!", url:"audio/blue-mountain-state/003_get_out_of_my_house.mp3"},
];
const TITLES = ["The Boys","Invincible","Breaking Bad","Family Guy","That '70s Show","Narcos","Succession","Peaky Blinders","It's Always Sunny in Philadelphia","Ozark","The Sopranos","The Wire","Rick and Morty","Silicon Valley","Arrested Development","Parks and Recreation","Atlanta","How I Met Your Mother","The Office","Game of Thrones","Friends","American Dad!","Blue Mountain State","Nathan For You","Seinfeld","The Simpsons","Drake & Josh","Beavis and Butt-Head","King of the Hill","Tropic Thunder","Step Brothers","Talladega Nights","Wedding Crashers","Superbad","This Is The End","The 40 Year Old Virgin","Anchorman","Office Space","Pineapple Express","Austin Powers: Goldmember","Strange Wilderness","The Hangover","The Other Guys","Zoolander","Borat","Django Unchained","Dodgeball","White Chicks","Dazed and Confused","Idiocracy","Pirates of the Caribbean","Forrest Gump","Pulp Fiction","The Devil Wears Prada","Mean Girls","Entourage","The Big Lebowski","Bridesmaids","Ferris Bueller's Day Off","Caddyshack","The Breakfast Club","Big Daddy","Rush Hour 2","Scarface"];
const TYPE = {}; // movie/show flag for the dropdown tag
["Tropic Thunder","Step Brothers","Talladega Nights","Wedding Crashers","Superbad","This Is The End","The 40 Year Old Virgin","Anchorman","Office Space","Pineapple Express","Austin Powers: Goldmember","Strange Wilderness","The Hangover","The Other Guys","Zoolander","Borat","Django Unchained","Dodgeball","White Chicks","Dazed and Confused","Idiocracy","Pirates of the Caribbean","Forrest Gump","Pulp Fiction","The Devil Wears Prada","Mean Girls","The Big Lebowski","Bridesmaids","Ferris Bueller's Day Off","Caddyshack","The Breakfast Club","Big Daddy","Rush Hour 2","Scarface"].forEach(t=>TYPE[t]="movie");
TITLES.forEach(t=>{ if(!TYPE[t]) TYPE[t]="show"; });

/* ---------- ladder config ---------- */
const MAX_GUESSES = 5;
// snippet stages carry their own window length (snipMs); reveals escalate down the ladder
const STAGES = [
  {label:"Clue 1 — short snippet",        mode:"snippet", snipMs:2500, limit:2,        caption:false, masked:false},
  {label:"Clue 2 — 5-second snippet",     mode:"snippet", snipMs:5000, limit:2,        caption:false, masked:false},
  {label:"Clue 3 — full clip",            mode:"full",                 limit:2,        caption:false, masked:false},
  {label:"Clue 4 — full clip + caption",  mode:"full",                 limit:Infinity, caption:true,  masked:false},
  {label:"Clue 5 — caption + masked title",mode:"full",                limit:Infinity, caption:true,  masked:true},
];
function snipMs(){ return STAGES[stage].snipMs || 2500; }

/* ---------- masking (clues 4 & 5) ---------- */
function isAlpha(c){ return /[a-z]/i.test(c); }
// level 1 = first+last letter per word; level 2 = also reveal ~half the rest
function maskTitle(title, level){
  return title.split(" ").map(word=>{
    const chars=[...word];
    const alphaIdx=chars.map((c,i)=>isAlpha(c)?i:-1).filter(i=>i>=0);
    const show=new Set();
    if(alphaIdx.length){ show.add(alphaIdx[0]); show.add(alphaIdx[alphaIdx.length-1]); }
    if(level>=2){ // reveal every other interior hidden letter
      const interior=alphaIdx.slice(1,-1);
      interior.forEach((idx,k)=>{ if(k%2===0) show.add(idx); });
    }
    return chars.map((c,i)=> (!isAlpha(c)||show.has(i)) ? c : '<span class="b">•</span>').join("");
  }).join("&nbsp;&nbsp;");
}

/* ---------- scoring + share ---------- */
function scoreFor(stageSolved){ return stageSolved==null ? 0 : (stageSolved + 1); } // the clue you solved on: clue1 -> 1/5 (best) … clue5 -> 5/5
// spoiler-free emoji strip: ⬛ a clue you used, 🟩 the clue you solved on, ⬜ a clue you didn't need
function shareStrip(stageSolved){
  const cells=[];
  for(let i=0;i<MAX_GUESSES;i++){
    if(stageSolved==null) cells.push("⬛");            // missed → every clue burned
    else if(i===stageSolved) cells.push("🟩");
    else if(i<stageSolved) cells.push("⬛");
    else cells.push("⬜");
  }
  return cells.join("");
}
// the full shareable text — brand line + score + strip + play link (no title/quote → no spoilers)
function buildShareText(num, stageSolved){
  const score = stageSolved==null ? "X/5" : scoreFor(stageSolved)+"/5";
  return `🎬 ${GAME_NAME} #${num} — ${score}\n${shareStrip(stageSolved)}\n${PLAY_URL}`;
}
// mobile → native share sheet; desktop → clipboard. Returns a status string for UI feedback.
async function shareResult(btn){
  const text = buildShareText(roundNo, solvedStage);
  if(navigator.share){
    try{ await navigator.share({ text }); return; }   // no title field — some apps prepend it as a duplicate top line
    catch(err){ if(err && err.name==="AbortError") return; } // user dismissed the sheet
  }
  try{
    await navigator.clipboard.writeText(text);
    flashBtn(btn, "Copied ✓");
  }catch{
    flashBtn(btn, "Press ⌘C to copy");
  }
}
function flashBtn(btn, msg){
  if(!btn) return;
  const orig = btn.dataset.label || btn.textContent;
  btn.dataset.label = orig;
  btn.textContent = msg;
  setTimeout(()=>{ if(btn) btn.textContent = btn.dataset.label; }, 1900);
}

/* ---------- game state ---------- */
let clip, stage, guesses, solvedStage, finished, roundNo=0, audio=null, snippetTimer=null, playsUsed=0;

/* win streak (persisted; real game keys this to calendar days, prototype counts consecutive wins) */
let streak = +(localStorage.getItem("ctq_proto_streak")||0);
function recordWin(){  streak++;   try{ localStorage.setItem("ctq_proto_streak", streak); }catch{} }
function recordLoss(){ streak=0;    try{ localStorage.setItem("ctq_proto_streak", streak); }catch{} }

// shuffle "bag": cycle through every clip once (random order) before any repeats
let clipBag=[];
function pickClip(){
  if(clipBag.length===0){
    clipBag = CLIPS.map((_,i)=>i);
    for(let i=clipBag.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [clipBag[i],clipBag[j]]=[clipBag[j],clipBag[i]]; }
    if(clip && CLIPS[clipBag[clipBag.length-1]]===clip && clipBag.length>1){ [clipBag[0],clipBag[clipBag.length-1]]=[clipBag[clipBag.length-1],clipBag[0]]; } // avoid back-to-back repeat across bags
  }
  return CLIPS[clipBag.pop()];
}
function startRound(){
  roundNo++;
  clip = pickClip();
  stage=0; guesses=0; solvedStage=null; finished=false; playsUsed=0;
  if(audio){ audio.pause(); }
  audio = new Audio(AUDIO_BASE + clip.url);
  audio.preload = "auto";            // buffer early so the midpoint seek is ready on first click
  audio.load();
  render();
}
function advanceClue(){ // wrong guess or skip
  guesses++;
  if(stage < MAX_GUESSES-1){ stage++; playsUsed=0; }   // new stage → fresh play allowance
  if(guesses>=MAX_GUESSES){ finished=true; recordLoss(); }
}

/* ---------- audio (per-stage mode + play limit) ---------- */
function stopAudio(){ if(snippetTimer){clearTimeout(snippetTimer);snippetTimer=null;} if(audio){audio.pause();} }
function canPlay(){ return playsUsed < STAGES[stage].limit; }
function snippetStart(){ // center this stage's snippet window on the clip's midpoint
  const d=audio.duration, win=snipMs()/1000;
  if(!isFinite(d) || d<=win) return 0;            // duration unknown/short → from the top
  return Math.max(0, d/2 - win/2);
}
function playWindowed(btn){ // seek to the middle, wait for the seek to land, then play the window
  const ms=snipMs();
  const fire=()=>{
    audio.play().then(()=>{
      btn&&btn.classList.add("playing");
      snippetTimer=setTimeout(()=>{ audio.pause(); btn&&btn.classList.remove("playing"); }, ms);
    }).catch(()=>{});
  };
  const seekThenFire=()=>{
    const target=snippetStart();
    if(Math.abs(audio.currentTime-target)<0.05){ fire(); return; }   // already there → seeked won't fire
    audio.addEventListener("seeked", function s(){ audio.removeEventListener("seeked",s); fire(); }, {once:true});
    audio.currentTime=target;
  };
  if(isFinite(audio.duration) && audio.duration>0){ seekThenFire(); }
  else { audio.addEventListener("loadedmetadata", function m(){ audio.removeEventListener("loadedmetadata",m); seekThenFire(); }, {once:true}); audio.load(); }
}
function playCurrent(btn){
  if(!canPlay()) return;
  playsUsed++;
  const st=STAGES[stage];
  stopAudio();
  if(st.mode==="snippet"){ playWindowed(btn); }
  else {
    audio.currentTime=0;
    audio.play().then(()=>{ btn&&btn.classList.add("playing"); }).catch(()=>{});
    audio.onended=()=>btn&&btn.classList.remove("playing");
  }
  refreshPlayUI();
}
function whatLabel(){
  const st=STAGES[stage];
  if(st.mode!=="snippet") return "full clip";
  return st.snipMs===2500 ? "short snippet" : `${st.snipMs/1000}-second snippet`;
}
function playHint(){
  const st=STAGES[stage];
  if(st.limit===Infinity) return `${whatLabel()[0].toUpperCase()+whatLabel().slice(1)} — listen as much as you like.`;
  return canPlay() ? `Tap to hear the ${whatLabel()}.` : `No listens left — guess or skip to unlock the next clue.`;
}
function listenLabel(){
  const st=STAGES[stage];
  if(st.limit===Infinity) return "🎧 Unlimited listens";
  return `🎧 ${playsUsed}/${st.limit} listens used`;
}
function refreshPlayUI(){
  const btn=document.getElementById("play"), hint=document.getElementById("phint"), lc=document.getElementById("listens");
  if(!btn) return;
  const ok=canPlay();
  btn.classList.toggle("disabled", !ok);
  btn.disabled=!ok;
  if(hint) hint.textContent=playHint();
  if(lc) lc.textContent=listenLabel();
}
// result screen: always the whole clip, no snippet cap, no limit
function playFullClip(btn){
  stopAudio(); audio.currentTime=0;
  audio.play().then(()=>{ btn&&btn.classList.add("playing"); }).catch(()=>{});
  audio.onended=()=>btn&&btn.classList.remove("playing");
}

/* ---------- guessing ---------- */
function submitGuess(title){
  if(finished) return;
  if(title===clip.show){ solvedStage=stage; finished=true; recordWin(); render(); return; }
  advanceClue();
  render(lastWrong=title);
}
function skipClue(){ if(finished) return; advanceClue(); render(); }
let lastWrong="";

/* ---------- render ---------- */
const card=document.getElementById("card");
function render(){
  if(finished) return renderResult();
  const dots = Array.from({length:MAX_GUESSES},(_,i)=>{
    const cls = i<stage?"used":(i===stage?"cur":"");
    return `<span class="d ${cls}"></span>`;
  }).join("");

  // reveals: caption from clue 4, masked title at clue 5
  let reveals="";
  if(STAGES[stage].caption){
    reveals += `<div class="reveal"><span class="k">The quote</span><span class="caption">“${clip.text}”</span></div>`;
  }
  if(STAGES[stage].masked){
    reveals += `<div class="reveal"><span class="k">${TYPE[clip.show]==="movie"?"Movie":"Show"} title</span><span class="masked">${maskTitle(clip.show,1)}</span></div>`;
  }

  const ok=canPlay();
  card.innerHTML = `
    <div class="rung">${dots}</div>
    <div class="stagelabel">${STAGES[stage].label}</div>
    <div class="play">
      <button class="pbtn ${ok?'':'disabled'}" id="play" aria-label="play" ${ok?'':'disabled'}>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="phint" id="phint">${playHint()}</div>
      <div class="listens" id="listens">${listenLabel()}</div>
    </div>
    <div class="reveals">${reveals}</div>
    <div class="guesswrap">
      <input class="ginput" id="guess" placeholder="Name the show or movie…" autocomplete="off">
      <div class="drop" id="drop"></div>
    </div>
    <div class="btnrow">
      <button class="act" id="skip">Skip clue ▸</button>
      <button class="act primary" id="go">Guess</button>
    </div>
    <div class="wrongs" id="wrongs">${lastWrong?("✗ Not “"+lastWrong+"”"):""}</div>
  `;
  lastWrong="";

  document.getElementById("play").onclick = e=>playCurrent(e.currentTarget);
  document.getElementById("skip").onclick = skipClue;
  wireAutocomplete();
}

const WIN_MSGS = ["Clocked it! ⏰","Nailed it! 🎯","Too easy 😎","You know your stuff 🍿","Ding ding ding! 🔔"];
function winMsg(){ return WIN_MSGS[(roundNo + (solvedStage||0)) % WIN_MSGS.length]; }

function renderResult(){
  stopAudio(); playsUsed=0;            // full clip is freely replayable on the result screen
  const won = solvedStage!=null;
  card.innerHTML = `
    <div class="result">
      <h2 class="${won?'win':''}">${won?winMsg():"Out of guesses 😬"}</h2>
      <p>${won?("Solved on clue "+(solvedStage+1)+" of 5"):"The answer was"}</p>
      <p class="showname ${won?'ans':'miss'}">${clip.show}
        <span class="typetag">${TYPE[clip.show]==="movie"?"movie":"show"}</span></p>
      <p class="desc">“${clip.text}”</p>
      <div class="play">
        <button class="pbtn" id="play" aria-label="play">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="phint">Replay the full clip</div>
      </div>
      <button class="act dl" id="dl">⬇  Download clip</button>
      <div class="share" id="share">${buildShareText(roundNo, solvedStage).replace(PLAY_URL, `<a href="${PLAY_URL}" target="_blank" rel="noopener">${PLAY_URL}</a>`)}</div>
      <div class="btnrow">
        <button class="act primary" id="share-btn">Share result</button>
        <button class="act" id="again">Next clip ↻</button>
      </div>
    </div>`;
  document.getElementById("play").onclick = e=>playFullClip(e.currentTarget);
  document.getElementById("again").onclick = startRound;
  document.getElementById("dl").onclick = ()=>saveClip(clip);
  document.getElementById("share-btn").onclick = e=>shareResult(e.currentTarget);
}

/* ---------- clip download / share (mirrors the TvTalk soundboard) ---------- */
function sanitizeFilename(t){ return ((t||"").replace(/[\/\\:*?"<>|]/g," ").replace(/\s+/g," ").trim())||"clip"; }
function buildClipFilename(show,text){ return sanitizeFilename(`tvtalk.fun - ${show} - ${text}`)+".mp3"; }
function triggerDownload(url,filename){
  const a=document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
}
async function saveClip(c){
  const url=AUDIO_BASE+c.url, filename=buildClipFilename(c.show,c.text);
  if(navigator.canShare){
    try{
      const resp=await fetch(url);
      if(resp.ok){
        const blob=await resp.blob();
        const file=new File([blob],filename,{type:"audio/mpeg"});
        if(navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
      }
    }catch(err){ if(err.name==="AbortError") return; }
  }
  triggerDownload(url,filename);
}

/* ---------- autocomplete ---------- */
function wireAutocomplete(){
  const input=document.getElementById("guess");
  const drop=document.getElementById("drop");
  let active=-1, shown=[];
  function refresh(){
    const q=input.value.trim().toLowerCase();
    shown = q ? TITLES.filter(t=>t.toLowerCase().includes(q)).slice(0,8) : [];
    active=-1;
    drop.innerHTML = shown.map((t,i)=>`<div class="opt" data-i="${i}"><span>${t}</span><span class="t">${TYPE[t]}</span></div>`).join("");
    drop.classList.toggle("show", shown.length>0);
    [...drop.children].forEach(el=>{
      el.onclick=()=>{ input.value=el.querySelector("span").textContent; drop.classList.remove("show"); commit(); };
    });
  }
  function setActive(i){ active=i; [...drop.children].forEach((el,k)=>el.classList.toggle("active",k===i)); }
  function commit(){
    const val=input.value.trim();
    const exact=TITLES.find(t=>t.toLowerCase()===val.toLowerCase());
    const pick = exact || (active>=0?shown[active]:shown[0]);
    if(pick) submitGuess(pick);
  }
  input.oninput=refresh;
  input.onkeydown=e=>{
    if(e.key==="ArrowDown"){e.preventDefault();setActive(Math.min(active+1,shown.length-1));}
    else if(e.key==="ArrowUp"){e.preventDefault();setActive(Math.max(active-1,0));}
    else if(e.key==="Enter"){e.preventDefault(); if(shown.length){input.value=shown[Math.max(active,0)]; drop.classList.remove("show");} commit();}
    else if(e.key==="Escape"){drop.classList.remove("show");}
  };
  document.getElementById("go").onclick=commit;
  input.focus();
}

document.getElementById("newRound").onclick=e=>{e.preventDefault();startRound();};
startRound();
</script>
