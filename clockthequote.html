<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock The Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* dark theater backdrop */
    --bg:#15110d; --muted:#a59a86;
    /* cream ticket + ink */
    --paper:#f3ead4; --paper2:#ece0c4; --pline:#d8c7a2;
    --ink:#221c14; --ink-m:#6f6450;
    --red:#b23222; --red-2:#c63c2a; --gold:#e7b24c;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--muted);font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,sans-serif;
       background:var(--bg);
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 16px 60px}

  /* marquee strip above the ticket */
  .mast{text-align:center;margin-bottom:18px}
  .bulbs{display:flex;gap:9px;justify-content:center;margin-bottom:11px}
  .bulb{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px 0 rgba(231,178,76,.5)}
  .bulb.off{background:#4a4038;box-shadow:none}
  .mast .sub{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}

  /* the ticket */
  .card{width:100%;max-width:460px;background:var(--paper);color:var(--ink);
        border-radius:8px;padding:0 26px 24px;position:relative;
        box-shadow:0 18px 40px -16px rgba(0,0,0,.75);
        background-image:radial-gradient(circle at 18px 50%, var(--bg) 0 7px, transparent 7.5px),
                         radial-gradient(circle at calc(100% - 18px) 50%, var(--bg) 0 7px, transparent 7.5px);
        background-repeat:no-repeat}

  /* ticket stub bars (ADMIT ONE / serial) */
  .stub{display:flex;justify-content:space-between;align-items:center;
        font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.14em;color:var(--red);
        padding:15px 0 13px}
  .stub.bot{color:var(--ink-m);justify-content:center;gap:7px;padding:16px 0 4px}
  .perf{border:0;border-top:1.5px dashed var(--pline);margin:0}

  /* wordmark on the ticket */
  .brand{text-align:center;padding:16px 0 6px}
  .brand h1{font-family:"Anton",sans-serif;font-weight:400;font-size:42px;letter-spacing:.01em;
            line-height:.86;margin:0;text-transform:uppercase;color:var(--ink)}
  .brand h1 em{font-style:normal;color:var(--red)}

  /* progress */
  .rung{display:flex;gap:8px;justify-content:center;margin:18px 0 16px}
  .rung .d{width:30px;height:5px;border-radius:99px;background:#decda7;transition:.25s}
  .rung .d.used{background:var(--red)}
  .rung .d.cur{background:var(--red);opacity:.4}
  .rung .d.solved{background:var(--red)}

  .stagelabel{text-align:center;color:var(--ink-m);font-size:11px;letter-spacing:.16em;
              text-transform:uppercase;font-family:ui-monospace,Menlo,monospace;margin-bottom:18px}

  /* play button */
  .play{display:flex;flex-direction:column;align-items:center;gap:13px;margin:6px 0 18px}
  .pbtn{width:100px;height:100px;border-radius:50%;border:2px solid var(--red);background:transparent;
        cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .pbtn:hover{background:var(--red)} .pbtn:hover svg{fill:var(--paper)}
  .pbtn svg{width:36px;height:36px;fill:var(--red);margin-left:5px;transition:fill .15s}
  .pbtn.playing{animation:pulse 1.1s ease-in-out infinite}
  .pbtn.disabled{border-color:#cdbc97;cursor:not-allowed}
  .pbtn.disabled svg{fill:#bcab86}
  .pbtn.disabled:hover{background:transparent}
  @keyframes pulse{50%{box-shadow:0 0 0 7px rgba(178,50,34,.14)}}
  .phint{font-size:13px;color:var(--ink-m)}
  .listens{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink-m);
           background:var(--paper2);border:1px solid var(--pline);border-radius:999px;padding:5px 14px}

  /* clue reveals */
  .reveals{min-height:6px;margin:2px 0 6px}
  .reveal{border-top:1.5px dashed var(--pline);padding:14px 2px}
  .reveal .k{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
             font-family:ui-monospace,Menlo,monospace;color:var(--red);margin-bottom:7px}
  .caption{font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:21px;line-height:1.35;color:var(--ink)}
  .masked{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:26px;letter-spacing:.14em;color:var(--red)}
  .masked .b{color:#c3b290}
  .blurtitle{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:26px;letter-spacing:.14em;color:var(--ink);
             filter:blur(8px);user-select:none;pointer-events:none}
  .kindtag{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
           color:var(--red);border:1px solid var(--pline);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}

  /* guess box */
  .guesswrap{position:relative;margin-top:20px}
  .ginput{width:100%;background:#fffaf0;border:1px solid var(--pline);color:var(--ink);font-family:inherit;
          border-radius:7px;padding:13px 15px;font-size:16px;outline:none}
  .ginput:focus{border-color:var(--red)}
  .ginput::placeholder{color:#a89c84}
  .drop{position:absolute;left:0;right:0;top:54px;background:#fffaf0;border:1px solid var(--pline);
        border-radius:7px;max-height:230px;overflow:auto;z-index:5;display:none;box-shadow:0 12px 26px -14px rgba(0,0,0,.4)}
  .drop.show{display:block}
  .opt{padding:11px 15px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
  .opt.active,.opt:hover{background:var(--paper2)}
  .opt .t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-m)}
  .btnrow{display:flex;gap:11px;margin-top:14px}
  button.act{flex:1;border-radius:7px;border:1px solid var(--pline);background:transparent;color:var(--ink);
             padding:14px;font-size:15px;font-weight:600;letter-spacing:.01em;
             cursor:pointer;font-family:inherit;transition:.12s}
  button.act:hover{border-color:#b7a47e;background:rgba(178,50,34,.04)}
  button.primary{background:var(--red);border-color:var(--red);color:var(--paper)}
  button.primary:hover{background:var(--red-2)}

  /* result */
  .result{text-align:center}
  .result h2{margin:6px 0 6px;font-family:"Anton",sans-serif;font-weight:400;font-size:30px;
             text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
  .result h2.win{color:var(--red)}
  .result .showname{font-family:"Anton",sans-serif;font-weight:400;font-size:30px;text-transform:uppercase;
                    letter-spacing:.01em;margin:6px 0 0;line-height:1;color:var(--ink)}
  .result .ans{color:var(--red)}
  .result .miss{color:var(--red)}
  .typetag{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-m);
           border:1px solid var(--pline);border-radius:999px;padding:3px 10px;vertical-align:middle;margin-left:10px;
           font-family:ui-monospace,Menlo,monospace}
  .result .desc{font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:18px;color:var(--ink-m);margin:10px 0 0}
  .result .streak{color:var(--red);font-weight:700;font-size:14px;margin:6px 0 0;letter-spacing:.02em}
  .share a{color:var(--red);text-decoration:underline}
  .act.dl{width:100%;margin-top:16px;background:transparent;border-color:var(--red);color:var(--red)}
  .act.dl:hover{background:var(--red);color:var(--paper);border-color:var(--red)}
  .share{font-family:ui-monospace,Menlo,monospace;background:var(--paper2);border:1px dashed var(--pline);
         border-radius:7px;padding:14px;margin:16px 0;font-size:13px;line-height:1.55;white-space:pre-wrap;
         overflow-wrap:anywhere;word-break:break-word;letter-spacing:.01em;color:var(--ink)}
  .share a{word-break:break-all}
  .small{color:var(--muted);font-size:12px;text-align:center;margin-top:20px;letter-spacing:.02em}
  .result .small{color:var(--ink-m)}
  .wrongs{font-size:12px;color:var(--red);min-height:16px;text-align:center;margin-top:10px;letter-spacing:.04em}
  a.replaybtn{color:var(--muted);font-size:13px;text-decoration:none;border-bottom:1px dotted var(--muted)}
</style>
</head>
<body>
  <div class="mast">
    <div class="bulbs"><span class="bulb"></span><span class="bulb"></span><span class="bulb off"></span><span class="bulb"></span><span class="bulb"></span></div>
    <div class="sub">Now Showing</div>
  </div>

  <div class="card" id="card"></div>
  <p class="small">Beta · A new quote every day at midnight ET.<br>
     <a href="/" class="replaybtn">← TV TALK soundboard</a></p>

<script>
/* ---------- data: 10 real clips + all 64 titles (from shows.js) ---------- */
const AUDIO_BASE = "/"; // served at /clockthequote; clips live at /audio/
const GAME_NAME = "Clock The Quote";
const PLAY_URL  = "https://tvtalk.fun/clockthequote";
// Daily queue: one specific clip per ET calendar day, in order. #1 = DAILY_START.
// All clips ≥8s so the centered snippet has audio on both sides; titles are in TITLES (guessable).
const DAILY_START = "2026-06-05"; // ET date of puzzle #1
const SCHEDULE = [
  {show:"Superbad",         text:"McLovin",                                        url:"audio/superbad/030_mclovin.mp3"},
  {show:"The Office",       text:"Bears. Beets. Battlestar Galactica",             url:"audio/the-office/019_bears_beets_battlestar_galactica.mp3"},
  {show:"Anchorman",        text:"I love lamp",                                    url:"audio/anchorman/055_i_love_lamp.mp3"},
  {show:"The Hangover",     text:"One man wolf pack",                              url:"audio/the-hangover/028_one_man_wolf_pack.mp3"},
  {show:"Forrest Gump",     text:"Life is like a box of chocolates",              url:"audio/forrest-gump/074_my_mom_always_said_life_was_like_a_box_of_chocolates_you_nev.mp3"},
  {show:"The Big Lebowski", text:"That rug really tied the room together",         url:"audio/big-lebowski/057_that_rug_really_tied_the_room_together_did_it_not_fucking_a.mp3"},
  {show:"Dodgeball",        text:"If you can dodge a wrench, you can dodge a ball", url:"audio/dodgeball/017_if_you_can_dodge_a_wrench_you_can_dodge_a_ball.mp3"},
  {show:"Talladega Nights", text:"Thank you sweet baby Jesus",                     url:"audio/talladega-nights/037_thank_you_sweet_baby_jesus.mp3"},
  {show:"Step Brothers",    text:"I didn't touch the drum set",                    url:"audio/step-brothers/043_look_i_didn_t_touch_a_drum_set_ok_i_witnessed_with_my_eyes_y.mp3"},
  {show:"The Office",       text:"Prison Mike",                                     url:"audio/the-office/261_prison_mike.mp3"},
  // —— days 11–20 ——
  {show:"Pulp Fiction",                       text:"Check out the big brain on Brett",       url:"audio/pulp-fiction/009_check_out_the_big_brain_on_brett_you_re_a_smart_motherfucker.mp3"},
  {show:"It's Always Sunny in Philadelphia",  text:"Can I offer you an egg in this trying time?", url:"audio/always-sunny/018_can_i_offer_you_an_egg_in_this_trying_time.mp3"},
  {show:"Zoolander",                          text:"He's almost too good looking",           url:"audio/zoolander/022_he_s_almost_too_good_looking_hey_paco_that_would_be_my_main.mp3"},
  {show:"Rick and Morty",                     text:"Ants in my eyes Johnson",                url:"audio/rick-and-morty/008_ants_in_my_eyes_johnson.mp3"},
  {show:"Dazed and Confused",                 text:"I get older, they stay the same age",    url:"audio/dazed-and-confused/003_i_get_older_they_stay_the_same_age.mp3"},
  {show:"Silicon Valley",                     text:"Billionaires are people too",            url:"audio/silicon-valley/020_billionaires_are_people_too.mp3"},
  {show:"Pineapple Express",                  text:"I feel like a slice of butter",          url:"audio/pineapple-express/020_i_feel_like_a_slice_of_butter.mp3"},
  {show:"Nathan For You",                     text:"I am so sad",                            url:"audio/nathan-for-you/011_i_am_so_sad.mp3"},
  {show:"Wedding Crashers",                   text:"We only use 10% of our hearts",          url:"audio/wedding-crashers/053_we_only_use_10_percent_of_our_hearts.mp3"},
  {show:"The Simpsons",                       text:"You've got the Shining",                 url:"audio/the-simpsons/026_boy_ye_read_my_thoughts_you_ve_got_the_shinin.mp3"},
  // —— days 21–30 ——
  {show:"Game of Thrones",          text:"Chaos is a ladder",                      url:"audio/game-of-thrones/026_chaos_is_a_ladder.mp3"},
  {show:"The Other Guys",           text:"Aim for the bushes",                     url:"audio/the-other-guys/001_aim_for_the_bushes.mp3"},
  {show:"Office Space",             text:"The jump-to-conclusions mat",            url:"audio/office-space/066_jump_to_conclusions.mp3"},
  {show:"Parks and Recreation",     text:"Galentine's Day",                        url:"audio/parks-and-rec/011_galentine_s_day.mp3"},
  {show:"Bridesmaids",              text:"Everybody has the flu",                  url:"audio/bridesmaids/015_everybody_has_the_flu.mp3"},
  {show:"Friends",                  text:"Are you in there, little fetus?",        url:"audio/friends/009_are_you_in_there_little_fetus_in_nine_months_will_you_come_g.mp3"},
  {show:"Pirates of the Caribbean", text:"You can always trust a dishonest man",   url:"audio/pirates-of-the-caribbean/011_dishonestman.mp3"},
  {show:"That '70s Show",           text:"It's Star Wars!",                        url:"audio/that-70s-show/023_i_am_so_excited_about_star_whores_fezzie_man_it_s_star_wars.mp3"},
  {show:"The Breakfast Club",       text:"You want to blow your scholarship?",     url:"audio/breakfast-club/051_you_want_to_blow_your_scholarship.mp3"},
  {show:"This Is The End",          text:"Something not that chill happened",      url:"audio/this-is-the-end/030_something_not_that_chill_happened_last_night.mp3"}, // REFILL BEFORE 2026-07-05 — queue loops past here
];
const TITLES = ["The Boys","Invincible","Breaking Bad","Family Guy","That '70s Show","Narcos","Succession","Peaky Blinders","It's Always Sunny in Philadelphia","Ozark","The Sopranos","The Wire","Rick and Morty","Silicon Valley","Arrested Development","Parks and Recreation","Atlanta","How I Met Your Mother","The Office","Game of Thrones","Friends","American Dad!","Blue Mountain State","Nathan For You","Seinfeld","The Simpsons","Drake & Josh","Beavis and Butt-Head","King of the Hill","Tropic Thunder","Step Brothers","Talladega Nights","Wedding Crashers","Superbad","This Is The End","The 40 Year Old Virgin","Anchorman","Office Space","Pineapple Express","Austin Powers: Goldmember","Strange Wilderness","The Hangover","The Other Guys","Zoolander","Borat","Django Unchained","Dodgeball","White Chicks","Dazed and Confused","Idiocracy","Pirates of the Caribbean","Forrest Gump","Pulp Fiction","The Devil Wears Prada","Mean Girls","Entourage","The Big Lebowski","Bridesmaids","Ferris Bueller's Day Off","Caddyshack","The Breakfast Club","Big Daddy","Rush Hour 2","Scarface"];
const TYPE = {}; // movie/show flag for the dropdown tag
["Tropic Thunder","Step Brothers","Talladega Nights","Wedding Crashers","Superbad","This Is The End","The 40 Year Old Virgin","Anchorman","Office Space","Pineapple Express","Austin Powers: Goldmember","Strange Wilderness","The Hangover","The Other Guys","Zoolander","Borat","Django Unchained","Dodgeball","White Chicks","Dazed and Confused","Idiocracy","Pirates of the Caribbean","Forrest Gump","Pulp Fiction","The Devil Wears Prada","Mean Girls","The Big Lebowski","Bridesmaids","Ferris Bueller's Day Off","Caddyshack","The Breakfast Club","Big Daddy","Rush Hour 2","Scarface"].forEach(t=>TYPE[t]="movie");
TITLES.forEach(t=>{ if(!TYPE[t]) TYPE[t]="show"; });

/* ---------- ladder config ---------- */
const MAX_GUESSES = 5;
// snippet stages carry their own window length (snipMs); reveals escalate down the ladder
const STAGES = [
  {label:"Clue 1 — short snippet",        mode:"snippet", snipMs:2500, limit:2,        caption:false, masked:false},
  {label:"Clue 2 — 5-second snippet",     mode:"snippet", snipMs:5000, limit:2,        caption:false, masked:false},
  {label:"Clue 3 — full clip",            mode:"full",                 limit:2,        caption:false, masked:false},
  {label:"Clue 4 — quote + blurred title", mode:"full",                limit:Infinity, caption:true,  blurTitle:true},
  {label:"Clue 5 — quote + title initials",mode:"full",                limit:Infinity, caption:true,  firstLetters:true},
];
function snipMs(){ return STAGES[stage].snipMs || 2500; }

/* ---------- masking (clues 4 & 5) ---------- */
function isAlpha(c){ return /[a-z]/i.test(c); }
// level 1 = first+last letter per word; level 2 = also reveal ~half the rest
function maskTitle(title, level){
  return title.split(" ").map(word=>{
    const chars=[...word];
    const alphaIdx=chars.map((c,i)=>isAlpha(c)?i:-1).filter(i=>i>=0);
    const show=new Set();
    if(alphaIdx.length){ show.add(alphaIdx[0]); if(level>=1) show.add(alphaIdx[alphaIdx.length-1]); }
    if(level>=2){ // reveal every other interior hidden letter
      const interior=alphaIdx.slice(1,-1);
      interior.forEach((idx,k)=>{ if(k%2===0) show.add(idx); });
    }
    return chars.map((c,i)=> (!isAlpha(c)||show.has(i)) ? c : '<span class="b">•</span>').join("");
  }).join("&nbsp;&nbsp;");
}

/* ---------- scoring + share ---------- */
function scoreFor(stageSolved){ return stageSolved==null ? 0 : (stageSolved + 1); } // the clue you solved on: clue1 -> 1/5 (best) … clue5 -> 5/5
// spoiler-free emoji strip: ⬛ a clue you used, 🟩 the clue you solved on, ⬜ a clue you didn't need
function shareStrip(stageSolved){
  const cells=[];
  for(let i=0;i<MAX_GUESSES;i++){
    if(stageSolved==null) cells.push("⬛");            // missed → every clue burned
    else if(i===stageSolved) cells.push("🟩");
    else if(i<stageSolved) cells.push("⬛");
    else cells.push("⬜");
  }
  return cells.join("");
}
// the full shareable text — brand line + score + strip + play link (no title/quote → no spoilers)
function buildShareText(num, stageSolved){
  const score = stageSolved==null ? "X/5" : scoreFor(stageSolved)+"/5";
  return `🎬 ${GAME_NAME} #${num} — ${score}\n${shareStrip(stageSolved)}\n${PLAY_URL}`;
}
// mobile → native share sheet; desktop → clipboard. Returns a status string for UI feedback.
async function shareResult(btn){
  const text = buildShareText(roundNo, solvedStage);
  if(navigator.share){
    try{ await navigator.share({ text }); return; }   // no title field — some apps prepend it as a duplicate top line
    catch(err){ if(err && err.name==="AbortError") return; } // user dismissed the sheet
  }
  try{
    await navigator.clipboard.writeText(text);
    flashBtn(btn, "Copied ✓");
  }catch{
    flashBtn(btn, "Press ⌘C to copy");
  }
}
function flashBtn(btn, msg){
  if(!btn) return;
  const orig = btn.dataset.label || btn.textContent;
  btn.dataset.label = orig;
  btn.textContent = msg;
  setTimeout(()=>{ if(btn) btn.textContent = btn.dataset.label; }, 1900);
}

/* ---------- game state ---------- */
let clip, stage, guesses, solvedStage, finished, roundNo=0, playsUsed=0;
// Web Audio: decode each clip once, then play an exact slice (snippet = midpoint + window).
// Avoids the <audio> seek + gesture bugs that broke mobile (iOS).
let audioCtx=null, clipBuffer=null, bufferReady=false, curSource=null, pendingPlay=null, audioUnlocked=false;

/* win streak (persisted; real game keys this to calendar days, prototype counts consecutive wins) */
let streak = +(localStorage.getItem("ctq_proto_streak")||0);
function recordWin(){  streak++;   try{ localStorage.setItem("ctq_proto_streak", streak); }catch{} }
function recordLoss(){ streak=0;    try{ localStorage.setItem("ctq_proto_streak", streak); }catch{} }

// daily selection: which puzzle number is "today" in US Eastern time (DST-safe).
function etDateKey(){ // "YYYY-MM-DD" for now in America/New_York, regardless of the viewer's tz
  return new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
}
function daysBetween(a,b){ // whole days from ISO date a -> ISO date b
  const [ya,ma,da]=a.split("-").map(Number), [yb,mb,db]=b.split("-").map(Number);
  return Math.round((Date.UTC(yb,mb-1,db)-Date.UTC(ya,ma-1,da))/86400000);
}
// puzzle number for today (or a ?day=N override for previewing the queue). 1-based.
function dailyNumber(){
  const q=new URLSearchParams(location.search).get("day");
  if(q!==null && /^\d+$/.test(q)) return Math.max(1,+q);
  return daysBetween(DAILY_START, etDateKey()) + 1;
}
// clip for a puzzle number; loops past the queue end so it never dead-ends (refill before then).
function clipForNumber(n){ const i=((n-1)%SCHEDULE.length+SCHEDULE.length)%SCHEDULE.length; return SCHEDULE[i]; }
function startRound(){
  roundNo = dailyNumber();
  clip = clipForNumber(roundNo);
  stage=0; guesses=0; solvedStage=null; finished=false; playsUsed=0;
  loadClip(clip);
  render();
}
function advanceClue(){ // wrong guess or skip
  guesses++;
  if(stage < MAX_GUESSES-1){ stage++; playsUsed=0; }   // new stage → fresh play allowance
  if(guesses>=MAX_GUESSES){ finished=true; recordLoss(); }
}

/* ---------- audio (Web Audio: decode once, play exact slices) ---------- */
function getCtx(){ if(!audioCtx){ const C=window.AudioContext||window.webkitAudioContext; audioCtx=new C(); } return audioCtx; }
// iOS keeps the AudioContext muted until a node is started inside a user gesture. Call this
// on every play tap: resume the context AND start a 1-sample silent buffer to unlock it.

VVVVVVVVVVVVVVVVVX/+xDE1gPAAAGkAAAAIAAANIAAAARVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVf/7EsTVg8AAAaQAAAAgAAA0gAAABFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVf/7EMTWA8AAAaQAAAAgAAA0gAAABFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//sSxNWDwAABpAAAACAAADSAAAAEVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//sQxNYDwAABpAAAACAAADSAAAAEVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVU=";
let silentEl=null;
function getSilent(){ if(!silentEl){ silentEl=new Audio(SILENT_URI); silentEl.loop=true; } return silentEl; }
function unlockAudio(){
  const ctx=getCtx();
  if(ctx.state==="suspended") ctx.resume();
  // iOS: a looping silent <audio> MEDIA element flips the page's audio session to "playback",
  // which makes Web Audio play through the hardware mute/ringer switch (off by default for WA).
  try{ getSilent().play().catch(()=>{}); }catch(e){}
  if(!audioUnlocked){
    try{ const b=ctx.createBuffer(1,1,22050), s=ctx.createBufferSource();
         s.buffer=b; s.connect(ctx.destination); s.start(0); audioUnlocked=true; }catch(e){}
  }
}
function loadClip(c){                              // fetch + decode at round start
  stopSource(); clipBuffer=null; bufferReady=false; pendingPlay=null;
  const want=c;
  fetch(AUDIO_BASE + c.url).then(r=> r.ok ? r.arrayBuffer() : Promise.reject())
    .then(ab=> getCtx().decodeAudioData(ab))
    .then(buf=>{
      if(clip!==want) return;                     // round changed mid-decode → drop
      clipBuffer=buf; bufferReady=true;
      if(pendingPlay){ const p=pendingPlay; pendingPlay=null; startSegment(p.mode, p.snipMs); }
    }).catch(()=>{});
}
function stopSource(){
  if(curSource){ try{ curSource.onended=null; curSource.stop(); }catch(e){} curSource=null; }
  const b=document.getElementById("play"); if(b) b.classList.remove("playing");
}
function segOffset(snipMs){                        // where the snippet window starts: centered on the midpoint
  const d=clipBuffer?clipBuffer.duration:0, win=snipMs/1000;
  return d<=win ? 0 : Math.max(0, d/2 - win/2);
}
function startSegment(mode, snipMs){               // mode "snippet" → a window; else the whole clip
  if(!clipBuffer) return;
  stopSource();
  const ctx=getCtx(), src=ctx.createBufferSource();
  src.buffer=clipBuffer; src.connect(ctx.destination); curSource=src;
  const btn=document.getElementById("play"); if(btn) btn.classList.add("playing");
  src.onended=()=>{ if(curSource===src) curSource=null; const b=document.getElementById("play"); if(b) b.classList.remove("playing"); };
  if(mode==="snippet"){ src.start(0, segOffset(snipMs), snipMs/1000); } // start now, from offset, for window seconds
  else { src.start(0, 0); }
}
function canPlay(){ return playsUsed < STAGES[stage].limit; }
function playCurrent(){
  if(!canPlay()) return;
  playsUsed++;
  unlockAudio();                                                  // resume + silent-blip unlock, inside the tap (iOS)
  const st=STAGES[stage];
  if(bufferReady) startSegment(st.mode, st.snipMs);
  else pendingPlay={mode:st.mode, snipMs:st.snipMs};              // ctx now unlocked → playing on decode is fine
  refreshPlayUI();
}
function whatLabel(){
  const st=STAGES[stage];
  if(st.mode!=="snippet") return "full clip";
  return st.snipMs===2500 ? "short snippet" : `${st.snipMs/1000}-second snippet`;
}
function playHint(){
  const st=STAGES[stage];
  if(st.limit===Infinity) return `${whatLabel()[0].toUpperCase()+whatLabel().slice(1)} — listen as much as you like.`;
  return canPlay() ? `Tap to hear the ${whatLabel()}.` : `No listens left — guess or skip to unlock the next clue.`;
}
function listenLabel(){
  const st=STAGES[stage];
  if(st.limit===Infinity) return "🎧 Unlimited listens";
  return `🎧 ${playsUsed}/${st.limit} listens used`;
}
function refreshPlayUI(){
  const btn=document.getElementById("play"), hint=document.getElementById("phint"), lc=document.getElementById("listens");
  if(!btn) return;
  const ok=canPlay();
  btn.classList.toggle("disabled", !ok);
  btn.disabled=!ok;
  if(hint) hint.textContent=playHint();
  if(lc) lc.textContent=listenLabel();
}
// result screen: always the whole clip, unlimited
function playFullClip(){
  unlockAudio();
  if(bufferReady) startSegment("full");
  else pendingPlay={mode:"full"};
}

/* ---------- guessing ---------- */
function submitGuess(title){
  if(finished) return;
  if(title===clip.show){ solvedStage=stage; finished=true; recordWin(); render(); return; }
  advanceClue();
  render(lastWrong=title);
}
function skipClue(){ if(finished) return; advanceClue(); render(); }
let lastWrong="";

/* ---------- render ---------- */
const card=document.getElementById("card");
// ticket chrome: ADMIT ONE stub + serial, wordmark, perforations
function serial(){ return "No. "+String(roundNo).padStart(3,"0"); }
function ticketTop(){
  return `<div class="stub"><span>ADMIT ONE</span><span>${serial()}</span></div>
    <hr class="perf">
    <div class="brand"><h1>Clock the <em>Quote</em></h1></div>
    <hr class="perf">`;
}
function ticketBot(){
  return `<hr class="perf"><div class="stub bot"><span>★</span><span>tvtalk.fun</span><span>★</span></div>`;
}
function render(){
  stopSource();                       // stop any playing clip when the clue view changes
  if(finished) return renderResult();
  const dots = Array.from({length:MAX_GUESSES},(_,i)=>{
    const cls = i<stage?"used":(i===stage?"cur":"");
    return `<span class="d ${cls}"></span>`;
  }).join("");

  // reveals: quote from clue 4; blurred full title at clue 4; first-letter initials + type at clue 5
  let reveals="";
  if(STAGES[stage].caption){
    reveals += `<div class="reveal"><span class="k">The quote</span><span class="caption">“${clip.text}”</span></div>`;
  }
  if(STAGES[stage].blurTitle){
    reveals += `<div class="reveal"><span class="k">The title</span><span class="blurtitle" aria-hidden="true">${clip.show}</span></div>`;
  }
  if(STAGES[stage].firstLetters){
    const kind = TYPE[clip.show]==="movie"?"Movie":"Show";
    reveals += `<div class="reveal"><span class="k">The title <span class="kindtag">${kind}</span></span><span class="masked">${maskTitle(clip.show,0)}</span></div>`;
  }

  const ok=canPlay();
  card.innerHTML = `
    ${ticketTop()}
    <div class="rung">${dots}</div>
    <div class="stagelabel">${STAGES[stage].label}</div>
    <div class="play">
      <button class="pbtn ${ok?'':'disabled'}" id="play" aria-label="play" ${ok?'':'disabled'}>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="phint" id="phint">${playHint()}</div>
      <div class="listens" id="listens">${listenLabel()}</div>
    </div>
    <div class="reveals">${reveals}</div>
    <div class="guesswrap">
      <input class="ginput" id="guess" placeholder="Name the show or movie…" autocomplete="off">
      <div class="drop" id="drop"></div>
    </div>
    <div class="btnrow">
      <button class="act" id="skip">Skip clue ▸</button>
      <button class="act primary" id="go">Guess</button>
    </div>
    <div class="wrongs" id="wrongs">${lastWrong?("✗ Not “"+lastWrong+"”"):""}</div>
    ${ticketBot()}
  `;
  lastWrong="";

  document.getElementById("play").onclick = e=>playCurrent(e.currentTarget);
  document.getElementById("skip").onclick = skipClue;
  wireAutocomplete();
}

// score-aware result copy: one tier per clue solved on (0=1/5 best … 4=5/5 squeaker), 5 options each.
// the day's puzzle number picks which option, so a given day is consistent but the pool rotates.
const WIN_MSGS = [
  [ "Clocked it cold 🎯", "First listen, no notes 🔥", "Didn't even break a sweat 😎", "Named it instantly ⚡", "Absolute pro 🏆" ],            // 1/5
  [ "Barely needed that 😎", "Locked in early 🔒", "Sharp ears 👂", "Two and done ✌️", "Made it look easy 🍿" ],                                  // 2/5
  [ "Right in the pocket 🍿", "Solid work 👌", "Middle of the reel, nailed it 🎬", "Three's the charm ✨", "Dialed it in 🎯" ],                    // 3/5
  [ "Cut it close 😅", "Clutch finish 💪", "Needed every clue 😮‍💨", "Down to the deadline ⏳", "Squeaked it out 🙌" ],                            // 4/5
  [ "Down to the wire ⏰", "Last-second save 😰", "By the skin of your teeth 😬", "Photo finish 🏁", "Phew — got there 💦" ],                       // 5/5
];
const FAIL_MSGS = [ "Out of guesses — get 'em tomorrow 😬", "Tough one — back tomorrow 🙈", "That one got away 🎣", "No dice today 🎲", "Better luck tomorrow 😤" ];
function winMsg(){ const arr = WIN_MSGS[solvedStage] || WIN_MSGS[WIN_MSGS.length-1]; return arr[roundNo % arr.length]; }
function failMsg(){ return FAIL_MSGS[roundNo % FAIL_MSGS.length]; }

function renderResult(){
  stopSource(); playsUsed=0;           // full clip is freely replayable on the result screen
  const won = solvedStage!=null;
  card.innerHTML = `
    ${ticketTop()}
    <div class="result">
      <h2 class="${won?'win':''}">${won?winMsg():failMsg()}</h2>
      <p>${won?("Solved on clue "+(solvedStage+1)+" of 5"):"The answer was"}</p>
      <p class="showname ${won?'ans':'miss'}">${clip.show}
        <span class="typetag">${TYPE[clip.show]==="movie"?"movie":"show"}</span></p>
      <p class="desc">“${clip.text}”</p>
      <div class="play">
        <button class="pbtn" id="play" aria-label="play">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="phint">Replay the full clip</div>
      </div>
      <button class="act dl" id="dl">⬇  Download clip</button>
      <div class="share" id="share">${buildShareText(roundNo, solvedStage).replace(PLAY_URL, `<a href="${PLAY_URL}" target="_blank" rel="noopener">${PLAY_URL}</a>`)}</div>
      <button class="act primary" id="share-btn" style="width:100%">Share result</button>
      <p class="small" style="margin-top:16px">Come back tomorrow for #${roundNo+1}.</p>
    </div>
    ${ticketBot()}`;
  document.getElementById("play").onclick = e=>playFullClip(e.currentTarget);
  document.getElementById("dl").onclick = ()=>saveClip(clip);
  document.getElementById("share-btn").onclick = e=>shareResult(e.currentTarget);
}

/* ---------- clip download / share (mirrors the TvTalk soundboard) ---------- */
function sanitizeFilename(t){ return ((t||"").replace(/[\/\\:*?"<>|]/g," ").replace(/\s+/g," ").trim())||"clip"; }
function buildClipFilename(show,text){ return sanitizeFilename(`tvtalk.fun - ${show} - ${text}`)+".mp3"; }
function triggerDownload(url,filename){
  const a=document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
}
async function saveClip(c){
  const url=AUDIO_BASE+c.url, filename=buildClipFilename(c.show,c.text);
  if(navigator.canShare){
    try{
      const resp=await fetch(url);
      if(resp.ok){
        const blob=await resp.blob();
        const file=new File([blob],filename,{type:"audio/mpeg"});
        if(navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
      }
    }catch(err){ if(err.name==="AbortError") return; }
  }
  triggerDownload(url,filename);
}

/* ---------- autocomplete ---------- */
function wireAutocomplete(){
  const input=document.getElementById("guess");
  const drop=document.getElementById("drop");
  let active=-1, shown=[];
  function refresh(){
    const q=input.value.trim().toLowerCase();
    shown = q ? TITLES.filter(t=>t.toLowerCase().includes(q)).slice(0,8) : [];
    active=-1;
    drop.innerHTML = shown.map((t,i)=>`<div class="opt" data-i="${i}"><span>${t}</span><span class="t">${TYPE[t]}</span></div>`).join("");
    drop.classList.toggle("show", shown.length>0);
    [...drop.children].forEach(el=>{
      el.onclick=()=>{ input.value=el.querySelector("span").textContent; drop.classList.remove("show"); commit(); };
    });
  }
  function setActive(i){ active=i; [...drop.children].forEach((el,k)=>el.classList.toggle("active",k===i)); }
  function commit(){
    const val=input.value.trim();
    const exact=TITLES.find(t=>t.toLowerCase()===val.toLowerCase());
    const pick = exact || (active>=0?shown[active]:shown[0]);
    if(pick) submitGuess(pick);
  }
  input.oninput=refresh;
  input.onkeydown=e=>{
    if(e.key==="ArrowDown"){e.preventDefault();setActive(Math.min(active+1,shown.length-1));}
    else if(e.key==="ArrowUp"){e.preventDefault();setActive(Math.max(active-1,0));}
    else if(e.key==="Enter"){e.preventDefault(); if(shown.length){input.value=shown[Math.max(active,0)]; drop.classList.remove("show");} commit();}
    else if(e.key==="Escape"){drop.classList.remove("show");}
  };
  document.getElementById("go").onclick=commit;
  input.focus();
}

startRound();
</script>
