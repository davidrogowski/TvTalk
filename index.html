<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TvTalk</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap');

  :root {
    --primary: #c41e3a;
    --accent:  #d4af37;
    --bg:      #0a0000;
    --bg-glow: #2a0a0a;
    --text:    #f0e6d2;
    --muted:   #888;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at center, var(--bg-glow) 0%, var(--bg) 70%);
    color: var(--text);
    font-family: 'Special Elite', monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem; overflow-x: hidden; position: relative;
    transition: background 0.4s ease;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; opacity: 0.08;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: overlay; z-index: 1;
  }

  .picker-row {
    position: fixed; top: 1.25rem; right: 1.25rem; z-index: 3;
  }
  .combo { position: relative; }
  .combo-trigger {
    display: flex; align-items: center; gap: 0.5rem;
    max-width: 240px;
    background: rgba(0,0,0,0.6);
    color: var(--text);
    border: 1px solid var(--accent);
    font-family: 'Special Elite', monospace;
    font-size: 0.9rem;
    padding: 0.4rem 0.7rem;
    letter-spacing: 0.05em;
    cursor: pointer;
  }
  .combo-trigger:focus-visible { outline: 2px solid var(--primary); }
  .combo-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .combo-caret {
    margin-left: auto; font-size: 0.7rem; opacity: 0.8;
    transition: transform 0.18s ease;
  }
  .combo-trigger[aria-expanded="true"] .combo-caret { transform: rotate(180deg); }

  .combo-panel {
    position: absolute; top: calc(100% + 0.4rem); right: 0;
    width: min(280px, 86vw);
    display: flex; flex-direction: column;
    background: rgba(8,8,8,0.97);
    border: 1px solid var(--accent);
    box-shadow: 0 14px 38px rgba(0,0,0,0.6);
    z-index: 20;
    animation: comboIn 0.16s ease;
  }
  .combo-panel[hidden] { display: none; }
  @keyframes comboIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: none; }
  }

  .combo-search {
    flex: none;
    background: rgba(255,255,255,0.05);
    color: var(--text);
    border: none;
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    font-family: 'Special Elite', monospace;
    font-size: 0.85rem;
    padding: 0.55rem 0.7rem;
    letter-spacing: 0.04em;
  }
  .combo-search::placeholder { color: var(--text); opacity: 0.4; }
  .combo-search:focus { outline: none; border-bottom-color: var(--primary); }

  .combo-list {
    list-style: none; margin: 0; padding: 0.25rem 0;
    overflow-y: auto; max-height: min(56vh, 380px);
  }
  .combo-list::-webkit-scrollbar { width: 8px; }
  .combo-list::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 4px;
  }
  .combo-group {
    padding: 0.5rem 0.7rem 0.2rem;
    font-family: 'Special Elite', monospace;
    font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--accent); opacity: 0.6;
  }
  .combo-option {
    padding: 0.4rem 0.7rem 0.4rem 1.1rem;
    font-family: 'Special Elite', monospace;
    font-size: 0.85rem; color: var(--text);
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .combo-option.is-random { padding-left: 0.7rem; }
  .combo-option:hover,
  .combo-option.active { background: color-mix(in srgb, var(--primary) 32%, transparent); }
  .combo-option[aria-selected="true"] {
    color: var(--accent); box-shadow: inset 3px 0 0 var(--accent);
  }
  .combo-empty {
    padding: 0.6rem 0.7rem; font-family: 'Special Elite', monospace;
    font-size: 0.8rem; color: var(--text); opacity: 0.5;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 9vw, 5.5rem); letter-spacing: 0.15em;
    color: var(--accent);
    text-shadow: 3px 3px 0 var(--primary), 6px 6px 0 #000;
    margin-bottom: 3rem; transform: skewX(-3deg);
    text-align: center;
    transition: color 0.3s, text-shadow 0.3s;
  }

  .button {
    position: relative;
    width: 240px; height: 240px; border-radius: 50%; border: none;
    background: radial-gradient(circle at 50% 30%,
      color-mix(in srgb, var(--primary) 70%, white) 0%,
      var(--primary) 32%,
      color-mix(in srgb, var(--primary) 60%, black) 78%,
      color-mix(in srgb, var(--primary) 35%, black) 100%);
    color: #fff;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem;
    letter-spacing: 0.12em;
    cursor: pointer;
    box-shadow:
      inset 0 14px 24px rgba(255,255,255,0.28),
      inset 0 -18px 30px rgba(0,0,0,0.45),
      0 14px 0 -2px color-mix(in srgb, var(--primary) 22%, black),
      0 20px 28px rgba(0,0,0,0.5),
      0 8px 14px rgba(0,0,0,0.3);
    transition: transform 0.1s ease-out, box-shadow 0.1s ease-out, background 0.3s;
    z-index: 2;
  }
  .button::after {
    content: '';
    position: absolute;
    inset: -32px;
    border-radius: 50%;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(circle,
      transparent 65%,
      color-mix(in srgb, var(--primary) 55%, transparent) 80%,
      transparent 100%);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .button:hover {
    transform: translateY(-2px);
    box-shadow:
      inset 0 14px 24px rgba(255,255,255,0.28),
      inset 0 -18px 30px rgba(0,0,0,0.45),
      0 16px 0 -2px color-mix(in srgb, var(--primary) 22%, black),
      0 22px 32px rgba(0,0,0,0.55),
      0 10px 16px rgba(0,0,0,0.35);
  }
  .button:active {
    transform: translateY(8px);
    box-shadow:
      inset 0 14px 24px rgba(255,255,255,0.28),
      inset 0 -18px 30px rgba(0,0,0,0.45),
      0 6px 0 -2px color-mix(in srgb, var(--primary) 22%, black),
      0 8px 10px rgba(0,0,0,0.4),
      0 3px 6px rgba(0,0,0,0.25);
  }
  .button.playing::after {
    animation: glow-pulse 1.2s ease-in-out infinite;
  }
  @keyframes glow-pulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50%      { opacity: 0.85; transform: scale(1.12); }
  }

  .quote-display { margin-top: 3rem; max-width: 620px; min-height: 120px; text-align: center; z-index: 2; }
  .quote-text {
    font-size: 1.4rem; line-height: 1.5; color: var(--text); font-style: italic;
    opacity: 0; transition: opacity 0.35s;
  }
  .quote-character {
    margin-top: 1rem; font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem;
    letter-spacing: 0.25em; color: var(--accent); opacity: 0; transition: opacity 0.35s, color 0.3s;
  }
  .quote-source {
    margin-top: 0.5rem; font-size: 0.75rem; letter-spacing: 0.2em; color: var(--muted);
    opacity: 0; transition: opacity 0.35s;
  }
  .visible { opacity: 1 !important; }

  .empty-hint {
    color: var(--muted); font-size: 0.9rem; max-width: 500px; text-align: center;
    line-height: 1.6;
  }
  .empty-hint code {
    background: rgba(255,255,255,0.06); padding: 0.1rem 0.4rem;
    border-radius: 3px; color: var(--accent);
  }

  @media (max-width: 600px) {
    body { padding: 1rem 0.75rem; }
    .picker-row { top: 0.75rem; right: 0.75rem; }
    .combo-trigger {
      font-size: 0.75rem;
      padding: 0.3rem 0.5rem;
      max-width: 55vw;
    }
    h1 { margin-top: 3rem; margin-bottom: 2rem; }
    .button {
      width: 200px; height: 200px;
      font-size: 2.5rem;
    }
    .quote-display { margin-top: 2rem; min-height: 80px; }
    .quote-text      { font-size: 1.1rem; line-height: 1.4; }
    .quote-character { font-size: 1rem; margin-top: 0.75rem; }
    .quote-source    { font-size: 0.7rem; }
  }

</style>
</head>
<body>
  <div class="picker-row">
    <div class="combo" id="combo">
      <button type="button" id="comboTrigger" class="combo-trigger"
              aria-haspopup="listbox" aria-expanded="false" aria-controls="comboPanel">
        <span id="comboLabel" class="combo-label">Random (all shows + movies)</span>
        <span class="combo-caret" aria-hidden="true">&#9662;</span>
      </button>
      <div id="comboPanel" class="combo-panel" role="dialog" aria-label="Choose a show or movie" hidden>
        <input type="text" id="comboSearch" class="combo-search" placeholder="Search&hellip;"
               autocomplete="off" spellcheck="false" aria-label="Search shows and movies">
        <ul id="comboList" class="combo-list" role="listbox" aria-label="Shows and movies"></ul>
      </div>
    </div>
  </div>

  <h1 id="title">TV TALK</h1>

  <button class="button" id="quoteBtn">PRESS</button>

  <div class="quote-display">
    <p class="quote-text"      id="quoteText"></p>
    <p class="quote-character" id="quoteChar"></p>
    <p class="quote-source"    id="quoteSource"></p>
  </div>

<script src="shows.js"></script>
<script>
  // ----- safety: shows.js missing or empty -----
  const SHOWS = (typeof shows !== 'undefined' && Array.isArray(shows)) ? shows : [];

  const els = {
    combo:   document.getElementById('combo'),
    trigger: document.getElementById('comboTrigger'),
    label:   document.getElementById('comboLabel'),
    panel:   document.getElementById('comboPanel'),
    search:  document.getElementById('comboSearch'),
    list:    document.getElementById('comboList'),
    title:   document.getElementById('title'),
    btn:     document.getElementById('quoteBtn'),
    text:    document.getElementById('quoteText'),
    char:    document.getElementById('quoteChar'),
    source:  document.getElementById('quoteSource'),
  };

  const RANDOM_ALL = '__random_all__';
  const RANDOM_SHOWS = '__random_shows__';
  const RANDOM_MOVIES = '__random_movies__';
  // mode value -> type filter for the pool (null = everything)
  const RANDOM_MODES = { [RANDOM_ALL]: null, [RANDOM_SHOWS]: 'show', [RANDOM_MOVIES]: 'movie' };
  let currentSelection = RANDOM_ALL;
  let lastKey = null;
  let currentAudio = null;
  let comboVisible = [];   // flat list of rendered <li> options, for keyboard nav
  let activeIndex = 0;

  const RANDOM_OPTS = [
    { value: RANDOM_ALL,    label: 'Random (all shows + movies)' },
    { value: RANDOM_SHOWS,  label: 'Random (all shows)' },
    { value: RANDOM_MOVIES, label: 'Random (all movies)' },
  ];
  const GROUPS_DATA = [
    { label: 'TV Shows', type: 'show' },
    { label: 'Movies',   type: 'movie' },
  ].map(g => ({
    label: g.label,
    items: SHOWS.filter(s => (s.type || 'show') === g.type)
                .sort((a, b) => a.name.localeCompare(b.name))
                .map(s => ({ value: s.id, label: s.name })),
  })).filter(g => g.items.length);

  function labelFor(value) {
    const r = RANDOM_OPTS.find(o => o.value === value);
    if (r) return r.label;
    const s = SHOWS.find(x => x.id === value);
    return s ? s.name : RANDOM_OPTS[0].label;
  }

  function setActive(i) {
    if (!comboVisible.length) return;
    activeIndex = (i + comboVisible.length) % comboVisible.length;
    comboVisible.forEach((li, k) => li.classList.toggle('active', k === activeIndex));
    comboVisible[activeIndex].scrollIntoView({ block: 'nearest' });
  }

  function renderList(query) {
    const q = (query || '').trim().toLowerCase();
    els.list.innerHTML = '';
    comboVisible = [];

    const addOption = (value, label, isRandom) => {
      const li = document.createElement('li');
      li.className = 'combo-option' + (isRandom ? ' is-random' : '');
      li.setAttribute('role', 'option');
      li.dataset.value = value;
      li.textContent = label;
      if (value === currentSelection) li.setAttribute('aria-selected', 'true');
      const idx = comboVisible.length;
      li.addEventListener('click', () => { applySelection(value); closeCombo(); });
      li.addEventListener('mousemove', () => setActive(idx));
      els.list.appendChild(li);
      comboVisible.push(li);
    };
    const addHeader = (text) => {
      const li = document.createElement('li');
      li.className = 'combo-group';
      li.setAttribute('aria-hidden', 'true');
      li.textContent = text;
      els.list.appendChild(li);
    };

    if (!q) RANDOM_OPTS.forEach(o => addOption(o.value, o.label, true));
    for (const g of GROUPS_DATA) {
      const items = g.items.filter(it => !q || it.label.toLowerCase().includes(q));
      if (!items.length) continue;
      addHeader(g.label);
      items.forEach(it => addOption(it.value, it.label, false));
    }
    if (!comboVisible.length) {
      const li = document.createElement('li');
      li.className = 'combo-empty';
      li.textContent = 'No matches';
      els.list.appendChild(li);
    }
    const sel = comboVisible.findIndex(li => li.dataset.value === currentSelection);
    setActive(sel >= 0 ? sel : 0);
  }

  function openCombo() {
    els.panel.hidden = false;
    els.trigger.setAttribute('aria-expanded', 'true');
    els.search.value = '';
    renderList('');
    els.search.focus();
    document.addEventListener('click', onDocClick, true);
  }
  function closeCombo() {
    els.panel.hidden = true;
    els.trigger.setAttribute('aria-expanded', 'false');
    document.removeEventListener('click', onDocClick, true);
  }
  function onDocClick(e) {
    if (!els.combo.contains(e.target)) closeCombo();
  }

  const DEFAULT_THEME = { primary: '#c41e3a', accent: '#d4af37', bg: '#0a0000' };
  function applyTheme(theme) {
    const t = { ...DEFAULT_THEME, ...(theme || {}) };
    document.documentElement.style.setProperty('--primary', t.primary);
    document.documentElement.style.setProperty('--accent',  t.accent);
    document.documentElement.style.setProperty('--bg',      t.bg);
    document.documentElement.style.setProperty(
      '--bg-glow',
      `color-mix(in srgb, ${t.primary} 18%, ${t.bg})`
    );
  }

  // ----- shareable links: ?show=<id|random-shows|random-movies> -----
  const RANDOM_SLUGS = { [RANDOM_SHOWS]: 'random-shows', [RANDOM_MOVIES]: 'random-movies' };
  const SLUG_TO_RANDOM = {
    'random': RANDOM_ALL, 'random-all': RANDOM_ALL,
    'random-shows': RANDOM_SHOWS, 'random-movies': RANDOM_MOVIES,
  };

  function selectionFromUrl() {
    const param = new URLSearchParams(location.search).get('show');
    if (!param) return RANDOM_ALL;
    if (param in SLUG_TO_RANDOM) return SLUG_TO_RANDOM[param];
    if (SHOWS.some(s => s.id === param)) return param;
    return RANDOM_ALL; // unknown / stale id -> default
  }

  function syncUrl() {
    const url = new URL(location.href);
    if (currentSelection === RANDOM_ALL) {
      url.searchParams.delete('show');           // default view -> clean URL
    } else if (currentSelection in RANDOM_MODES) {
      url.searchParams.set('show', RANDOM_SLUGS[currentSelection]);
    } else {
      url.searchParams.set('show', currentSelection);
    }
    history.replaceState(null, '', url);
  }

  function applySelection(value) {
    currentSelection = value;
    lastKey = null;
    els.label.textContent = labelFor(value);
    if (value in RANDOM_MODES) {
      applyTheme(DEFAULT_THEME);
      els.title.textContent = 'TV TALK';
    } else {
      const show = SHOWS.find(s => s.id === value);
      if (show) {
        applyTheme(show.theme);
        els.title.textContent = show.name.toUpperCase();
      }
    }
    syncUrl();
    clearQuote();
  }

  function clearQuote() {
    els.text.classList.remove('visible');
    els.char.classList.remove('visible');
    els.source.classList.remove('visible');
  }

  function buildPool() {
    if (currentSelection in RANDOM_MODES) {
      const typeFilter = RANDOM_MODES[currentSelection]; // null | 'show' | 'movie'
      const pool = [];
      for (const s of SHOWS) {
        if (typeFilter && (s.type || 'show') !== typeFilter) continue;
        for (let i = 0; i < s.quotes.length; i++) {
          pool.push({ showId: s.id, showName: s.name, index: i, quote: s.quotes[i] });
        }
      }
      return pool;
    }
    const s = SHOWS.find(x => x.id === currentSelection);
    if (!s) return [];
    return s.quotes.map((q, i) => ({ showId: s.id, showName: s.name, index: i, quote: q }));
  }

  function pick(pool) {
    if (pool.length === 0) return null;
    if (pool.length === 1) return pool[0];
    let chosen;
    do {
      chosen = pool[Math.floor(Math.random() * pool.length)];
    } while (`${chosen.showId}::${chosen.index}` === lastKey);
    lastKey = `${chosen.showId}::${chosen.index}`;
    return chosen;
  }

  function showQuote(item) {
    const q = item.quote;
    const show = SHOWS.find(s => s.id === item.showId);
    const textStyle = show?.text_style || 'caption';
    clearQuote();
    setTimeout(() => {
      els.text.textContent   = textStyle === 'title' ? q.text : `"${q.text}"`;
      els.char.textContent   = q.character ? `— ${q.character}` : '';
      els.source.textContent = (currentSelection in RANDOM_MODES) ? item.showName : '';
      els.text.classList.add('visible');
      if (q.character)                       els.char.classList.add('visible');
      if (currentSelection in RANDOM_MODES)  els.source.classList.add('visible');
    }, 80);
  }

  function playAudio(q) {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    if (!q.audioUrl) { els.btn.classList.remove('playing'); return; }
    currentAudio = new Audio(q.audioUrl);
    currentAudio.onended = () => els.btn.classList.remove('playing');
    currentAudio.onerror = () => els.btn.classList.remove('playing');
    currentAudio.play().catch(() => els.btn.classList.remove('playing'));
  }

  function showEmptyState() {
    els.btn.style.display = 'none';
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.innerHTML = `
      <p>No shows loaded yet.</p><br>
      <p>Run <code>python3 scripts/scrape_soundboard.py --show the-boys</code>,
      then <code>python3 scripts/build_shows.py</code>,
      then refresh.</p>
    `;
    document.querySelector('.quote-display').appendChild(hint);
  }

  if (SHOWS.length === 0) {
    showEmptyState();
  } else {
    els.trigger.addEventListener('click', () => {
      if (els.panel.hidden) openCombo(); else closeCombo();
    });
    els.search.addEventListener('input', () => renderList(els.search.value));
    els.search.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown')     { e.preventDefault(); setActive(activeIndex + 1); }
      else if (e.key === 'ArrowUp')  { e.preventDefault(); setActive(activeIndex - 1); }
      else if (e.key === 'Enter')    {
        e.preventDefault();
        const li = comboVisible[activeIndex];
        if (li) { applySelection(li.dataset.value); closeCombo(); els.trigger.focus(); }
      } else if (e.key === 'Escape') { e.preventDefault(); closeCombo(); els.trigger.focus(); }
    });

    applySelection(selectionFromUrl());   // pre-select from a shared link

    els.btn.addEventListener('click', () => {
      const pool = buildPool();
      const item = pick(pool);
      if (!item) return;
      showQuote(item);
      els.btn.classList.add('playing');
      playAudio(item.quote);
    });
  }
</script>
</body>
</html>
